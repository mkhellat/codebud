[project]
name = "codebud"
version = "0.1.0"
description = "A privacy-first, local coding agent using Ollama — no API key required."
readme = "README.md"
# PEP 639: SPDX license expression and the license file(s) to ship.
license = "GPL-3.0-or-later"
license-files = ["COPYING"]
authors = [
    { name = "Mohammadreza Khellat", email = "mkhellat@beavernets.com" },
]
keywords = ["llm", "coding-agent", "ollama", "ai", "automation", "local-ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: BSD :: FreeBSD",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "prompt_toolkit>=3.0",
    # 2.32.4: fixes CVE-2023-32681 (Proxy-Authorization leak on redirect),
    # CVE-2024-35195 and CVE-2024-47081 (.netrc credentials leak).
    "requests>=2.32.4",
    # config.toml: tomllib is in the standard library from Python 3.11.
    "tomli>=1.1; python_version < '3.11'",
]

# Optional features users can install: pip install 'codebud[openai]'
[project.optional-dependencies]
openai = ["openai>=1.0"]
# Project search (codebud index + retrieval): one BLAS matrix-vector product
# scores every chunk.
rag = ["numpy>=1.24"]
# Encryption at rest (age): sessions, history, project indexes, the
# security layer's evidence log.
crypto = ["pyrage>=1.2"]

# PEP 735: tools for working on codebud itself, not installable by users:
# pip install -e . --group dev
[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "ruff>=0.3",
    "build>=1.0",
    "numpy>=1.24",  # the rag extra, so its tests run
    "pyrage>=1.2",  # the crypto extra, so its tests run
]

[project.scripts]
codebud = "codebud.cli.main:main"

[project.urls]
Repository   = "https://github.com/mkhellat/codebud"
Documentation = "https://github.com/mkhellat/codebud/tree/main/docs"
"Bug Tracker" = "https://github.com/mkhellat/codebud/issues"
Changelog    = "https://github.com/mkhellat/codebud/blob/main/NEWS"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codebud = ["data/policy/*.json", "data/skill/SKILL.md", "data/skill/agensi/SKILL.md"]

[build-system]
requires = ["setuptools>=77"]  # 77: PEP 639 license expressions
build-backend = "setuptools.build_meta"

# ─── pytest ───────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths  = ["tests"]
addopts    = "-q"

# ─── ruff ────────────────────────────────────────────────────────────────────

[tool.ruff]
line-length    = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line too long — handled by ruff format
]

[tool.ruff.lint.isort]
known-first-party = ["codebud", "codebud_sec"]
