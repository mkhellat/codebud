# Publish to PyPI with trusted publishing (OIDC): no API token is stored
# anywhere, and PyPI attaches PEP 740 attestations to each file.
#
#   push a tag vX.Y.Z  → build → TestPyPI → PyPI
#   run it by hand     → build → TestPyPI only (a rehearsal)
#
# PyPI and TestPyPI each need a "pending publisher" for this repository,
# workflow file release.yml and environment pypi / testpypi; see
# "Publishing a release" in the manual's Development chapter.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: The tag matches the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' pyproject.toml)
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match version ${version}"
            exit 1
          fi

      - name: Build and check
        run: |
          python -m pip install --upgrade pip
          python -m pip install "build>=1.0" "twine>=5.0"
          python -m build
          python -m twine check --strict dist/*

      - name: Keep the files for the publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/project/codebud/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # A rehearsal may run again for a version already there.
          skip-existing: true

  pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/codebud/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
